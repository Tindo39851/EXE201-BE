server:
  port: ${PORT:5000}
  forward-headers-strategy: framework

spring:
  application:
    name: gametrust-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gametrust}
      auto-index-creation: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  # Base64-encoded 256-bit or longer key for HS256/HS384/HS512
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  issuer: gametrust.gg
  # 15 minutes (in milliseconds)
  expiration: ${JWT_EXPIRATION:900000}
  # 7 days (in milliseconds)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}

gametrust:
  otp:
    # Local E2E only. Keep false in deployed environments and configure SMTP instead.
    dev-mode: ${OTP_DEV_MODE:false}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

livekit:
  server-url: ${LIVEKIT_SERVER_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}
  token-ttl-seconds: ${LIVEKIT_TOKEN_TTL_SECONDS:300}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:600}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
