server:
  port: 5000

spring:
  application:
    name: gametrust-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gametrust}
      auto-index-creation: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  # Base64-encoded 256-bit or longer key for HS256/HS384/HS512
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  issuer: gametrust.gg
  # 15 minutes (in milliseconds)
  expiration: ${JWT_EXPIRATION:900000}
  # 7 days (in milliseconds)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}

gametrust:
  otp:
    # Local E2E only. Keep false in deployed environments and configure SMTP instead.
    dev-mode: ${OTP_DEV_MODE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
